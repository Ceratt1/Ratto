spring:
  application:
    name: event-ledger
  datasource:
    url: jdbc:postgresql://localhost:5432/learn_ia_ledger
    username: ledger
    password: ledger

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

kafka:
  bootstrap-servers: localhost:9092
