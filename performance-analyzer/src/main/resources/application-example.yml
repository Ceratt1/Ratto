spring:
  application:
    name: performance-analyzer
  kafka:
    bootstrap-servers: localhost:9092

kafka:
  bootstrap-servers: ${spring.kafka.bootstrap-servers}

ai:
  base-url: https://generativelanguage.googleapis.com/v1beta
  api-key:
  model: gemini-3.5-flash
  fallback-models: gemini-2.5-flash,gemini-3.1-flash-lite
  temperature: 0.2
  max-output-tokens: 8192

openrouter:
  enabled: true
  base-url: https://openrouter.ai/api/v1
  api-key:
  model: openai/gpt-4o
  search-model: openai/gpt-4o

web-search:
  enabled: true

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
