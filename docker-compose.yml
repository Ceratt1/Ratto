services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: ratto-api-gateway:local
    depends_on:
      frontend:
        condition: service_healthy
      producer:
        condition: service_healthy
      core-service:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    ports:
      - "3000:8080"
      - "127.0.0.1:9075:9090"
    environment:
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9090
      GATEWAY_ROUTES_FRONTEND_URL: ${GATEWAY_ROUTES_FRONTEND_URL:-http://frontend:3000}
      GATEWAY_ROUTES_KEYCLOAK_URL: ${GATEWAY_ROUTES_KEYCLOAK_URL:-http://keycloak:8080}
      GATEWAY_ROUTES_CORE_URL: ${GATEWAY_ROUTES_CORE_URL:-http://core-service:8071}
      GATEWAY_ROUTES_PRODUCER_URL: ${GATEWAY_ROUTES_PRODUCER_URL:-http://producer:8070}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${GATEWAY_PUBLIC_URL:-http://localhost:3000}/realms/ratto
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ratto/protocol/openid-connect/certs
      SECURITY_AUDIENCE: gateway-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health/readiness >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ratto-frontend:local
    depends_on:
      producer:
        condition: service_healthy
      core-service:
        condition: service_healthy
      event-ledger:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      PRODUCER_BASE_URL: http://producer:8070/api
      CORE_SERVICE_BASE_URL: http://core-service:8071
      EVENT_LEDGER_BASE_URL: http://event-ledger:9090
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:3000}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ratto}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ratto-frontend}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    image: ratto-producer:local
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
      - "8070"
    ports:
      - "127.0.0.1:9070:9090"
    environment:
      SERVER_PORT: 8070
      SPRING_WEBFLUX_BASE_PATH: /api
      MANAGEMENT_SERVER_PORT: 9090
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: ${AWS_S3_PATH_STYLE_ACCESS_ENABLED:-false}
      AWS_S3_PRESIGNED_URL_DURATION_MINUTES: ${AWS_S3_PRESIGNED_URL_DURATION_MINUTES:-15}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${GATEWAY_PUBLIC_URL:-http://localhost:3000}/realms/ratto
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ratto/protocol/openid-connect/certs
      SECURITY_AUDIENCE: producer-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health/readiness >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pdf-extractor:
    build:
      context: .
      dockerfile: pdf-extractor/Dockerfile
    image: ratto-pdf-extractor:local
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:9071:9090"
    environment:
      SERVER_PORT: 9090
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: ${AWS_S3_PATH_STYLE_ACCESS_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health/readiness >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  question-generator:
    build:
      context: .
      dockerfile: question-generator/Dockerfile
    image: ratto-question-generator:local
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:9072:9090"
    environment:
      SERVER_PORT: 9090
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: ${AWS_S3_PATH_STYLE_ACCESS_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_API_KEY: ${GEMINI_API_KEY}
      AI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      AI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
      AI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-8192}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health/readiness >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  performance-analyzer:
    build:
      context: .
      dockerfile: performance-analyzer/Dockerfile
    image: ratto-performance-analyzer:local
    depends_on:
      kafka:
        condition: service_healthy
    expose:
      - "9090"
    environment:
      SERVER_PORT: 9090
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: ${AWS_S3_PATH_STYLE_ACCESS_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_API_KEY: ${GEMINI_API_KEY}
      AI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      AI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
      AI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-8192}
      WEB_SEARCH_ENABLED: ${PERFORMANCE_WEB_SEARCH_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health/readiness >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres-ledger:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${LEDGER_POSTGRES_DB:-ratto_ledger}
      POSTGRES_USER: ${LEDGER_POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${LEDGER_POSTGRES_PASSWORD:-ledger}
    volumes:
      - ledger-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LEDGER_POSTGRES_USER:-ledger} -d ${LEDGER_POSTGRES_DB:-ratto_ledger}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres-keycloak:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_POSTGRES_USER:-keycloak} -d ${KEYCLOAK_POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: start-dev --import-realm --health-enabled=true
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KEYCLOAK_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
      KC_HOSTNAME: ${GATEWAY_PUBLIC_URL:-http://localhost:3000}
      KC_PROXY_HEADERS: xforwarded
      KC_METRICS_ENABLED: "true"
      KC_SPI_THEME_DEFAULT: ratto
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    volumes:
      - ./infra/keycloak/ratto-realm.json:/opt/keycloak/data/import/ratto-realm.json:ro
      - ./infra/keycloak/themes/ratto:/opt/keycloak/themes/ratto:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.6.3
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/config/configure-realm.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:3000}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:3000}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-Ratto@2026}
      SSO_GOOGLE_ENABLED: ${SSO_GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SSO_AZURE_ENABLED: ${SSO_AZURE_ENABLED:-false}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
    volumes:
      - ./infra/keycloak/configure-realm.sh:/config/configure-realm.sh:ro
    restart: "no"

  postgres-core:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${CORE_POSTGRES_DB:-ratto_core}
      POSTGRES_USER: ${CORE_POSTGRES_USER:-core}
      POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD:-core}
    volumes:
      - core-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_POSTGRES_USER:-core} -d ${CORE_POSTGRES_DB:-ratto_core}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    image: ratto-core-service:local
    depends_on:
      postgres-core:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
      - "8071"
    ports:
      - "127.0.0.1:9074:9090"
    environment:
      SERVER_PORT: 8071
      MANAGEMENT_SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-core:5432/${CORE_POSTGRES_DB:-ratto_core}
      SPRING_DATASOURCE_USERNAME: ${CORE_POSTGRES_USER:-core}
      SPRING_DATASOURCE_PASSWORD: ${CORE_POSTGRES_PASSWORD:-core}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: ${AWS_S3_PATH_STYLE_ACCESS_ENABLED:-false}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${GATEWAY_PUBLIC_URL:-http://localhost:3000}/realms/ratto
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ratto/protocol/openid-connect/certs
      SECURITY_AUDIENCE: core-service-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health/readiness >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  event-ledger:
    build:
      context: .
      dockerfile: event-ledger/Dockerfile
    image: ratto-event-ledger:local
    depends_on:
      kafka:
        condition: service_healthy
      postgres-ledger:
        condition: service_healthy
    ports:
      - "127.0.0.1:9073:9090"
    environment:
      SERVER_PORT: 9090
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ledger:5432/${LEDGER_POSTGRES_DB:-ratto_ledger}
      SPRING_DATASOURCE_USERNAME: ${LEDGER_POSTGRES_USER:-ledger}
      SPRING_DATASOURCE_PASSWORD: ${LEDGER_POSTGRES_PASSWORD:-ledger}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health/readiness >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    depends_on:
      api-gateway:
        condition: service_healthy
      producer:
        condition: service_healthy
      pdf-extractor:
        condition: service_healthy
      question-generator:
        condition: service_healthy
      performance-analyzer:
        condition: service_healthy
      event-ledger:
        condition: service_healthy
      core-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      cadvisor:
        condition: service_started
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    ports:
      - "127.0.0.1:9080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
    restart: unless-stopped

  # kafka-ui:
  #   image: provectuslabs/kafka-ui:v0.7.2
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   ports:
  #     - "127.0.0.1:8080:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  #   restart: unless-stopped

volumes:
  ledger-postgres-data:
  keycloak-postgres-data:
  core-postgres-data:
  prometheus-data:
  grafana-data:
